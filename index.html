<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>島嶼雷達｜台港澳手游市場情報</title>
<style>
:root {

* { box-sizing: border-box; }

  function filteredNews(){const q=(document.getElementById('nwSearch')?.value||'').trim().toLowerCase(),country=document.getElementById('nwCountry')?.value||'all',dateRange=document.getElementById('nwDate')?.value||'all',source=document.getElementById('nwSource')?.value||'all',important=document.getElementById('nwImportant')?.value||'all';const cutoff=new Date('2026-10-13T23:59:59');return state.news.filter(n=>{if(newsCategory!=='all'&&n.category!==newsCategory)return false;if(q&&!`${n.title} ${n.summary} ${(n.tags||[]).join(' ')}`.toLowerCase().includes(q))return false;if(country!=='all'&&n.country!==country)return false;if(source!=='all'&&n.source!==source)return false;if(important==='important'&&!n.important)return false;if(important==='saved'&&!n.saved)return false;if(dateRange!=='all'){const diff=(cutoff-new Date(n.date))/(86400000);if(dateRange==='today'&&diff>1)return false;if(dateRange!=='today'&&diff>Number(dateRange))return false;}return true;}).sort((a,b)=>new Date(b.date)-new Date(a.date));}

  function saveGame(){const form=document.getElementById('gameForm');if(!form.reportValidity())return;const fd=new FormData(form);const id=fd.get('id')||'g'+Date.now();const countries=[...form.querySelectorAll('input[name="countries"]:checked')].map(e=>e.value);if(!countries.length){toast('請至少選擇一個發行地區');return;}const existing=gameById(id);const getRank=(key,prev)=>{const cur=Number(fd.get(key))||null;return {cur,best:cur?(prev?.best?Math.min(cur,prev.best):cur):null,worst:cur?(prev?.worst?Math.max(cur,prev.worst):cur):null};};const g={...(existing||{}),id,name:fd.get('name').trim(),genre:fd.get('genre').trim(),slogan:fd.get('slogan').trim(),publisher:fd.get('publisher').trim(),icon:fd.get('icon').trim()||'✦',palette:existing?.palette??(state.games.length%iconPalette.length),countries,status:fd.get('status'),storeMark:fd.get('storeMark').trim(),preorderDate:fd.get('preorderDate'),estimatedLaunch:fd.get('estimatedLaunch'),launchDate:fd.get('launchDate'),week:fd.get('week').trim()||'2026-W41',downloads:Number(fd.get('downloads'))||0,revenue:Number(fd.get('revenue'))||0,iosDL:getRank('iosDL',existing?.iosDL),iosGross:getRank('iosGross',existing?.iosGross),gpDL:getRank('gpDL',existing?.gpDL),gpGross:getRank('gpGross',existing?.gpGross),appStore:fd.get('appStore').trim(),googlePlay:fd.get('googlePlay').trim(),source:fd.get('source').trim(),updated:isoNow()};if(!existing){g.trend=Array(7).fill(0);state.games.unshift(g);}else{state.games=state.games.map(x=>x.id===id?g:x);}persist(false);closeModal();renderPage(currentPage);toast('遊戲資料已儲存並同步更新');}

  function promoteLive(id){const g=gameById(id);if(!g)return;closeModal();openModal('確認轉為已上線',`即將更新「${esc(g.name)}」的狀態。`, `<p style="font-size:12px;line-height:1.8;color:var(--muted)">此操作會將遊戲狀態改為「已上線」，並同步移出預訂遊戲列表、加入數據總覽。若尚未正式上架，請取消操作。</p><div class="detail-hero">${getIcon(g)}<div><div class="detail-game-title">${esc(g.name)}</div><div class="modal-sub">預計上線：${fmtDate(g.estimatedLaunch)}</div></div></div>`,`<button class="btn" onclick="window.__radar.closeModal()">取消</button><button class="btn btn-primary" onclick="window.__radar.confirmPromote('${id}')">確認已上線</button>`);}

  function openMarketingForm(prefill={}){const gameOpts=state.games.map(g=>`<option value="${g.id}" ${prefill.gameId===g.id?'selected':''}>${esc(g.name)}</option>`).join('');const typeOpts=marketingTypes.map(t=>`<option value="${t[0]}" ${prefill.type===t[0]?'selected':''}>${t[1]}</option>`).join('');openModal('新增行銷紀錄','將合作內容關聯到遊戲，圖片可先記錄來源網址，後續再擴充上傳功能。',`<form id="marketingForm"><div class="form-grid"><div class="form-field"><label>關聯遊戲 *</label><select name="gameId" required>${gameOpts}</select></div><div class="form-field"><label>行銷類型 *</label><select name="type" required>${typeOpts}</select></div><div class="form-field"><label>合作對象 / 作品名稱 *</label><input name="name" required value="${esc(prefill.name||'')}" placeholder="輸入人物、作品、媒體或品牌"></div><div class="form-field"><label>發布日期 *</label><input name="date" type="date" required value="${esc(prefill.date||isoNow())}"></div><div class="form-field"><label>來源平台</label><input name="platform" value="${esc(prefill.platform||'')}" placeholder="YouTube、Facebook、Twitch…"></div><div class="form-field"><label>原始內容連結</label><input name="link" type="url" value="${esc(prefill.link||'')}" placeholder="https://..."></div><div class="form-field full"><label>合作內容簡介 *</label><textarea name="summary" required placeholder="說明素材形式、活動內容或合作亮點">${esc(prefill.summary||'')}</textarea></div><div class="form-field full"><label>圖片 / 素材連結</label><input name="asset" type="url" value="${esc(prefill.asset||'')}" placeholder="可先記錄雲端素材連結"></div></div></form>`,`<button class="btn" onclick="window.__radar.closeModal()">取消</button><button class="btn btn-primary" onclick="window.__radar.saveMarketing()">儲存紀錄</button>`,true);}
  function saveMarketing(){const form=document.getElementById('marketingForm');if(!form.reportValidity())return;const fd=new FormData(form);state.marketing.unshift({id:'m'+Date.now(),gameId:fd.get('gameId'),type:fd.get('type'),name:fd.get('name').trim(),date:fd.get('date'),platform:fd.get('platform').trim(),link:fd.get('link').trim(),asset:fd.get('asset').trim(),summary:fd.get('summary').trim(),note:''});persist(false);closeModal();renderPage('marketing');toast('行銷案例已儲存');}
  function showMarketingCell(gameId,type){const g=gameById(gameId),t=marketingTypes.find(x=>x[0]===type);if(!g||!t)return;const records=state.marketing.filter(m=>m.gameId===gameId&&m.type===type);const content=records.length?records.map(m=>`<div class="media-row"><div class="media-pic" style="background:${iconPalette[(g.palette+1)%iconPalette.length]}">${esc(t[2])}</div><div class="media-info"><div class="media-title">${esc(m.name)}</div><div class="media-desc">${esc(m.summary)}<br>${fmtDate(m.date)} · ${esc(m.platform||'來源平台未設定')} ${m.note?`· ${esc(m.note)}`:''}</div>${m.link?`<a class="cell-link" href="${esc(m.link)}" target="_blank" rel="noreferrer">開啟合作連結 ↗</a>`:'<span class="helper">原始內容連結待補</span>'}</div><button class="btn btn-small" onclick="window.__radar.editMarketing('${m.id}')">編輯</button></div>`).join(''):'<div class="blank"><div class="blank-icon">＋</div>目前沒有此類行銷紀錄。</div>';openModal(`${esc(g.name)} · ${t[1]}`,`共 ${records.length} 筆紀錄，可查看連結、來源及內容摘要。`,content,`<button class="btn" onclick="window.__radar.closeModal()">關閉</button><button class="btn btn-primary" onclick="window.__radar.addMarketingFor('${gameId}','${type}')">＋ 新增紀錄</button>`,true);}
  function editMarketing(id){const m=state.marketing.find(x=>x.id===id);if(!m)return;closeModal();openMarketingForm(m);const form=document.getElementById('marketingForm');form.querySelector('button');form.dataset.editId=id;document.querySelector('#modalRoot .modal-title').textContent='編輯行銷紀錄';document.querySelector('#modalRoot .modal-foot .btn-primary').textContent='更新紀錄';}
  function updateMarketingIfEdit(){const form=document.getElementById('marketingForm');if(!form.reportValidity())return;const fd=new FormData(form);const data={gameId:fd.get('gameId'),type:fd.get('type'),name:fd.get('name').trim(),date:fd.get('date'),platform:fd.get('platform').trim(),link:fd.get('link').trim(),asset:fd.get('asset').trim(),summary:fd.get('summary').trim()};if(form.dataset.editId){const old=state.marketing.find(m=>m.id===form.dataset.editId);Object.assign(old,data);}else state.marketing.unshift({id:'m'+Date.now(),...data,note:''});persist(false);closeModal();renderPage('marketing');toast('行銷紀錄已儲存');}

  function openNewsForm(news=null){const n=news||{title:'',summary:'',category:'game',country:'台灣',source:'',date:new Date().toISOString().slice(0,16),link:'',tags:[],note:'',saved:false,important:false};const cats=categoryInfo.map(c=>`<option value="${c[0]}" ${n.category===c[0]?'selected':''}>${c[1]}</option>`).join('');openModal(news?'編輯資訊':'新增資訊','請保留原始新聞連結及發布時間，以便回溯來源。',`<form id="newsForm"><input name="id" type="hidden" value="${esc(n.id||'')}"><div class="form-grid"><div class="form-field full"><label>新聞標題 *</label><input name="title" required value="${esc(n.title)}"></div><div class="form-field full"><label>資訊摘要 *</label><textarea name="summary" required>${esc(n.summary)}</textarea></div><div class="form-field"><label>資訊分類 *</label><select name="category">${cats}</select></div><div class="form-field"><label>市場地區 *</label><select name="country"><option ${n.country==='台灣'?'selected':''}>台灣</option><option ${n.country==='香港'?'selected':''}>香港</option><option ${n.country==='澳門'?'selected':''}>澳門</option></select></div><div class="form-field"><label>新聞來源 *</label><input name="source" required value="${esc(n.source)}" placeholder="媒體或官方來源名稱"></div><div class="form-field"><label>原始發布時間 *</label><input name="date" type="datetime-local" required value="${esc(n.date?String(n.date).slice(0,16):'')}"></div><div class="form-field full"><label>原始新聞連結</label><input name="link" type="url" value="${esc(n.link||'')}" placeholder="https://..."></div><div class="form-field full"><label>關鍵字標籤（以逗號分隔）</label><input name="tags" value="${esc((n.tags||[]).join(', '))}" placeholder="遊戲新品, KOL, IP 聯動"></div><div class="form-field full"><label>內部備註</label><textarea name="note">${esc(n.note||'')}</textarea></div><div class="form-field"><label><input type="checkbox" name="important" ${n.important?'checked':''}> 標記為重點資訊</label></div><div class="form-field"><label><input type="checkbox" name="saved" ${n.saved?'checked':''}> 加入收藏</label></div></div></form>`,`<button class="btn" onclick="window.__radar.closeModal()">取消</button><button class="btn btn-primary" onclick="window.__radar.saveNews()">儲存資訊</button>`,true);}
  function saveNews(){const form=document.getElementById('newsForm');if(!form.reportValidity())return;const fd=new FormData(form);const item={id:fd.get('id')||'n'+Date.now(),title:fd.get('title').trim(),summary:fd.get('summary').trim(),category:fd.get('category'),country:fd.get('country'),source:fd.get('source').trim(),date:fd.get('date'),link:fd.get('link').trim(),tags:fd.get('tags').split(',').map(x=>x.trim()).filter(Boolean),note:fd.get('note').trim(),important:form.elements.important.checked,saved:form.elements.saved.checked,mock:false};const idx=state.news.findIndex(n=>n.id===item.id);if(idx>=0)state.news[idx]=item;else state.news.unshift(item);persist(false);closeModal();renderPage('news');toast('資訊已儲存');}
  function editNews(id){const n=state.news.find(x=>x.id===id);if(n)openNewsForm(n);}
  function toggleNewsSaved(id){const n=state.news.find(x=>x.id===id);if(!n)return;n.saved=!n.saved;persist(false);renderNewsResults();}
  function toggleNewsImportant(id){const n=state.news.find(x=>x.id===id);if(!n)return;n.important=!n.important;persist(false);renderNewsResults();}
  function newsNote(id){const n=state.news.find(x=>x.id===id);if(!n)return;openModal('資訊備註',esc(n.title),'`', '',false);const body=document.querySelector('#modalRoot .modal-body');body.innerHTML=`<div class="form-field"><label>內部備註</label><textarea id="noteText" placeholder="紀錄對行銷策略的啟發、待確認事項或關聯專案">${esc(n.note||'')}</textarea></div>`;document.querySelector('#modalRoot .modal-foot')?.remove();document.querySelector('#modalRoot .modal').insertAdjacentHTML('beforeend',`<footer class="modal-foot"><button class="btn" onclick="window.__radar.closeModal()">取消</button><button class="btn btn-primary" onclick="window.__radar.saveNewsNote('${id}')">儲存備註</button></footer>`);}
  function saveNewsNote(id){const n=state.news.find(x=>x.id===id);if(n)n.note=document.getElementById('noteText').value;persist(false);closeModal();toast('備註已儲存');}
  function searchNewsTag(tag){renderPage('news');document.getElementById('nwSearch').value=tag;renderNewsResults();}

  function compareSelected(){const games=[...selectedCompare].map(gameById).filter(Boolean);if(games.length<2){toast('請至少選擇兩款遊戲進行比較');return;}const max=Math.max(...games.map(g=>g.downloads),1);openModal('遊戲表現比較',`已選擇 ${games.length} 款遊戲 · 統計週期以各遊戲資料為準`, `<div class="grid-2" style="grid-template-columns:1fr 1fr"><section class="panel"><div class="panel-head"><div class="panel-title">每週下載量</div></div><div class="panel-body" style="display:grid;gap:12px">${games.map(g=>`<div><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:6px"><span>${esc(g.name)}</span><strong>${Number(g.downloads).toLocaleString()}</strong></div><div class="progress"><span style="width:${Math.max(2,g.downloads/max*100)}%"></span></div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div class="panel-title">每週收入（NTD）</div></div><div class="panel-body" style="display:grid;gap:12px">${games.map(g=>`<div><div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:6px"><span>${esc(g.name)}</span><strong>${money(g.revenue)}</strong></div><div class="progress"><span style="width:${Math.max(2,g.revenue/Math.max(...games.map(x=>x.revenue),1)*100)}%;background:#2ca781"></span></div></div>`).join('')}</div></section></div><div class="detail-section"><h3>排名對比</h3><div class="table-scroll"><table><thead><tr><th>遊戲</th><th>iOS 下載</th><th>iOS 暢銷</th><th>Google 下載</th><th>Google 暢銷</th></tr></thead><tbody>${games.map(g=>`<tr><td>${esc(g.name)}</td><td>${g.iosDL.cur?'#'+g.iosDL.cur:'-'}</td><td>${g.iosGross.cur?'#'+g.iosGross.cur:'-'}</td><td>${g.gpDL.cur?'#'+g.gpDL.cur:'-'}</td><td>${g.gpGross.cur?'#'+g.gpGross.cur:'-'}</td></tr>`).join('')}</tbody></table></div></div>`,`<button class="btn btn-primary" onclick="window.__radar.closeModal()">完成</button>`,true);}
  function sort(key,active){if(sortBy===key)sortDirection*=-1;else{sortBy=key;sortDirection=key==='game'?1:-1;}renderOverviewTable();}
  function overPage(n){overviewPage=Math.max(1,n);renderOverviewTable();}
  function exportCSV(type='games'){let rows,filename;if(type==='marketing'){rows=[['遊戲名稱','發行地區','行銷類型','合作對象','內容簡介','發布日期','來源平台','原始連結'],...state.marketing.map(m=>[gameById(m.gameId)?.name||'',regionText(gameById(m.gameId)||{}),(marketingTypes.find(t=>t[0]===m.type)||['',''])[1],m.name,m.summary,m.date,m.platform,m.link])];filename='島嶼雷達_行銷追蹤.csv';}else{const cols=['遊戲名稱','遊戲定位','Slogan','發行地區','上架日期','統計週期','App Store下載榜目前排名','App Store下載榜最佳排名','App Store下載榜最差排名','App Store暢銷榜目前排名','App Store暢銷榜最佳排名','App Store暢銷榜最差排名','Google Play下載榜目前排名','Google Play下載榜最佳排名','Google Play下載榜最差排名','Google Play暢銷榜目前排名','Google Play暢銷榜最佳排名','Google Play暢銷榜最差排名','每週下載量','每週收入NTD','資料來源','最後更新'];rows=[cols,...filteredOverview().map(g=>[g.name,g.genre,g.slogan,regionText(g),g.launchDate,g.week,g.iosDL.cur,g.iosDL.best,g.iosDL.worst,g.iosGross.cur,g.iosGross.best,g.iosGross.worst,g.gpDL.cur,g.gpDL.best,g.gpDL.worst,g.gpGross.cur,g.gpGross.best,g.gpGross.worst,g.downloads,g.revenue,g.source,g.updated])];filename='島嶼雷達_數據總覽.csv';}const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');downloadBlob(csv,filename,'text/csv;charset=utf-8;');toast('CSV 已匯出');}
  function exportBackup(){const blob=JSON.stringify({...state,backupAt:new Date().toISOString()},null,2);downloadBlob(blob,'島嶼雷達_資料備份.json','application/json');toast('資料備份已匯出');}
  function downloadBlob(text,filename,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function restoreBackup(file){const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!Array.isArray(d.games)||!Array.isArray(d.marketing)||!Array.isArray(d.news))throw new Error('format');state={games:d.games,marketing:d.marketing,news:d.news,lastSaved:new Date().toISOString(),newsLastUpdate:d.newsLastUpdate||null};persist(false);renderPage(currentPage);toast('資料備份還原完成');}catch(e){toast('無法讀取，請選擇島嶼雷達匯出的 JSON 備份');}};reader.readAsText(file);}
  function globalSearchChanged(){globalQuery=document.getElementById('globalSearch').value;}
  function globalSearchGo(){globalSearchChanged();const q=globalQuery.trim();if(!q){renderPage(currentPage);return;}if(currentPage==='overview'){renderPage('overview');const e=document.getElementById('ovSearch');if(e){e.value=q;renderOverviewTable();}}else if(currentPage==='marketing'){renderPage('marketing');document.getElementById('mkSearch').value=q;renderMarketingMatrix();}else if(currentPage==='bookings'){renderPage('bookings');document.getElementById('bkSearch').value=q;renderBookingResults();}else{renderPage('news');document.getElementById('nwSearch').value=q;renderNewsResults();}}
  function addMarketingFor(gameId,type){closeModal();openMarketingForm({gameId,type});}
  function setAllHandlers(){document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.addEventListener('click',()=>renderPage(b.dataset.page)));document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter')globalSearchGo();});document.getElementById('globalRegion').addEventListener('change',e=>{if(currentPage==='overview'){renderOverview();bindOverview();const c=document.getElementById('ovCountry');if(['台灣','香港','澳門'].includes(e.target.value)){c.value=e.target.value;renderOverviewTable();}}else if(currentPage==='marketing'){renderMarketing();if(['台灣','香港','澳門'].includes(e.target.value)){document.getElementById('mkCountry').value=e.target.value;renderMarketingMatrix();}}else if(currentPage==='bookings'){renderBookings();if(['台灣','香港','澳門'].includes(e.target.value)){document.getElementById('bkCountry').value=e.target.value;renderBookingResults();}}else{renderNews();if(['台灣','香港','澳門'].includes(e.target.value)){document.getElementById('nwCountry').value=e.target.value;renderNewsResults();}}});document.getElementById('backupBtn').addEventListener('click',exportBackup);document.getElementById('topBackup').addEventListener('click',exportBackup);document.getElementById('restoreBtn').addEventListener('click',()=>document.getElementById('restoreFile').click());document.getElementById('restoreFile').addEventListener('change',e=>{if(e.target.files?.[0])restoreBackup(e.target.files[0]);e.target.value='';});document.getElementById('mobileMenu').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});}
  window.__radar={closeModal,gameDetail,showPackage,openGameForm,saveGame,editGame,openBookingForm,promoteLive,confirmPromote,openMarketingForm,saveMarketing:updateMarketingIfEdit,showMarketingCell,editMarketing,addMarketingFor,openNewsForm,saveNews,editNews,toggleNewsSaved,toggleNewsImportant,newsNote,saveNewsNote,searchNewsTag,exportCSV,exportBackup,sort,overPage,compareSelected};
  // All demo figures are explicitly labelled as non-live sample data.
  setAllHandlers();updateNavCounts();renderPage('overview');
})();
</script>

ive-table{min-width:850px}}

const campaignsFor=x=>(state.intel?.campaigns||[]).filter(c=>{const a=normalizeName(x.title),b=normalizeName(c.game);return a===b||(a.length>5&&b.length>5&&(a.includes(b)||b.includes(a)))});

const newsType=n=>{
 if(n.category)return n.category;
 const t=String(n.title||''),tags=(n.tags||[]).join(' ');
 if(/事前預約|事前登錄|預先註冊|預訂|預註冊|開放預約/.test(t+tags))return '預約動態';
 if(/上線|上市|公測|正式推出|開服|上架|停營|結束營運|停止營運/.test(t+tags))return '上線動態';
 if(/聯名|聯動|代言|KOL|實況|合作|主題曲|演唱會|快閃|活動|線下|展會|週年|周年/.test(t+tags))return '行銷活動';
 if(/排行榜|暢銷|市場|營收|下載量|發行商|財報|產業|廣告|投放|買量|趨勢/.test(t+tags))return '市場趨勢';

};

 return '<article class="intel-booking '+(lead?'intel-booking-lead':'')+'"><div class="intel-booking-header"><div class="intel-booking-icon">'+(hasIcon?'<img loading="lazy" src="'+url(g.icon)+'" alt="遊戲 Icon">':'<span>GAME</span>')+'</div><div class="intel-booking-name"><div class="intel-eyebrow">'+escapeHtml(g.status||'待查證')+'</div><h3>'+title+'</h3><p>'+escapeHtml(g.publisher||'發行商待確認')+' · '+escapeHtml(g.genre||'類型待確認')+'</p></div></div>'

function bookingEvents(g){
 const out=[];
 const reg=String(g.registration_date||'');
 if(/^\d{4}-\d{2}-\d{2}$/.test(reg))out.push({date:reg,type:'preorder',label:'開放預約'});
 const ios=String(g.ios_preorder_date||'');
 const gp=String(g.gp_preorder_date||'');
 if(/^\d{4}-\d{2}-\d{2}$/.test(ios)&&ios===gp)out.push({date:ios,type:'preorder',label:'iOS／GP 商店預約'});
 else {
  if(/^\d{4}-\d{2}-\d{2}$/.test(ios))out.push({date:ios,type:'preorder',label:'iOS 商店預訂'});
  if(/^\d{4}-\d{2}-\d{2}$/.test(gp))out.push({date:gp,type:'preorder',label:'GP 預先註冊'});
 }
 const iosExpected=String(g.ios_expected_date||'');
 const gpExpected=String(g.gp_expected_date||'');
 if(/^\d{4}-\d{2}-\d{2}$/.test(gpExpected)&&!g.launch_date&&gpExpected!==String(g.expected_date||'')&&gpExpected!==String(g.ios_expected_date||''))out.push({date:gpExpected,type:'expected',label:'GP 商店預計上架'});
 if(/^\d{4}-\d{2}-\d{2}$/.test(iosExpected)&&!g.launch_date&&iosExpected!==String(g.expected_date||''))out.push({date:iosExpected,type:'expected',label:'iOS 商店預計上架'});
 const launch=String(g.launch_date||'');
 const expected=String(g.expected_date||'');
 if(/^\d{4}-\d{2}-\d{2}$/.test(launch))out.push({date:launch,type:'launch',label:launch>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'})?'即將上線':'已上線'});
 else if(g.expected_precision==='day'&&/^\d{4}-\d{2}-\d{2}$/.test(expected))out.push({date:expected,type:'expected',label:g.expected_date_source?'商店預計上架':'預計上線'});
 return out;
}

 const first=new Date(Date.UTC(year,month-1,1)),offset=(first.getUTCDay()+6)%7,days=new Date(Date.UTC(year,month,0)).getUTCDate();

const searchBox=document.querySelector('.global-search input');if(searchBox)searchBox.addEventListener('keydown',e=>{if(e.key==='Enter'){state.search=e.target.value;state.page='overview';render()}},true);
fetch('/data/appstore.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{state.data=d;state.loading=false;const c=document.getElementById('navLiveCount');if(c)c.textContent=String((d.countries?.tw?.free||[]).length);const n=document.getElementById('navNewsCount');if(n)n.textContent=String((d.news||[]).length);const b=document.getElementById('navBookingCount');if(b)b.textContent='0';render()}).catch(e=>{state.loading=false;state.error=e.message;render()});
fetch('/data/intelligence.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{state.intel=d;const b=document.getElementById('navBookingCount');if(b)b.textContent=String(d?.preorders?.length||0);const n=document.getElementById('navNewsCount');if(n)n.textContent=String(d?.news?.length||0);render()}).catch(()=>{});
fetch('/data/alerts.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{state.alertsData=d;const n=(d?.alerts||[]).filter(a=>a.level==='high').length;const target=document.getElementById('radarAlertCount');if(target)target.textContent=String(n);if(state.page==='overview')render()}).catch(()=>{});
fetch('/data/googleplay.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{state.gpData=d;if(state.platform==='gp')render()}).catch(()=>{});
render();
})();
</script>

</body>
</html>
