<style>

const bookingEventDate=g=>{
 const launch=String(g.launch_date||'');

 const planned=String(g.expected_date||'');

};
function bookingCalendar(games){
 const [yy,mm]=state.bookingMonth.split('-').map(Number);
 const first=new Date(Date.UTC(yy,mm-1,1));
 const offset=(first.getUTCDay()+6)%7;
 const days=new Date(Date.UTC(yy,mm,0)).getUTCDate();
 const cells=Math.ceil((offset+days)/7)*7;
 const prev=new Date(Date.UTC(yy,mm-2,1)).toISOString().slice(0,7),next=new Date(Date.UTC(yy,mm,1)).toISOString().slice(0,7);
 const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
 const events=games.map((g,i)=>({g,i,e:bookingEventDate(g)})).filter(x=>x.e);
 const dates=Array.from({length:cells},(_,i)=>{
  const date=new Date(Date.UTC(yy,mm-1,i-offset+1)).toISOString().slice(0,10);
  const day=Number(date.slice(-2)),current=date.slice(0,7)===state.bookingMonth;
  const list=events.filter(x=>x.e.date===date);
  return '<div class="intel-cal-day '+(!current?'outside ':'')+(date===today?'today':'')+'"><div class="intel-cal-date">'+(day===1?Number(date.slice(5,7))+'/':'')+day+'</div><div class="intel-cal-events">'+list.map(({g,i,e})=>'<button type="button" class="intel-cal-event '+e.type+'" data-booking-index="'+i+'" title="'+escapeHtml(g.game+' · '+e.label)+'">'+(g.icon?'<img src="'+url(g.icon)+'" alt="">':'<span class="intel-cal-icon">▣</span>')+'<span class="intel-cal-event-name">'+escapeHtml(g.game)+'</span><span class="intel-cal-event-tag">'+e.label+'</span></button>').join('')+'</div></div>';
 }).join('');
 const undated=games.map((g,i)=>({g,i,e:bookingEventDate(g)})).filter(x=>!x.e||x.e.type==='preorder'&&gExpectedYear(x.g));
 return '<div class="intel-calendar"><div class="intel-calendar-top"><div><h2>'+yy+' 年 '+mm+' 月</h2><p>點選遊戲查看完整預訂情報、商店五圖及官方連結</p></div><div class="intel-cal-actions"><button type="button" data-booking-month="'+prev+'" aria-label="上個月">‹</button><button type="button" id="intelBookingToday">本月</button><button type="button" data-booking-month="'+next+'" aria-label="下個月">›</button></div></div><div class="intel-cal-legend"><span><i class="preorder"></i>開放預約</span><span><i class="expected"></i>預計上線</span><span><i class="launch"></i>已上線</span></div><div class="intel-cal-scroll"><div class="intel-cal-grid"><div class="intel-cal-weekdays">'+['一 MON','二 TUE','三 WED','四 THU','五 FRI','六 SAT','日 SUN'].map(d=>'<span>'+d+'</span>').join('')+'</div><div class="intel-cal-days">'+dates+'</div></div></div></div>'
 +(undated.length?'<div class="intel-cal-undated"><strong>尚無確切上市日 / 僅有預約日期</strong><div>'+undated.map(({g,i})=>'<button type="button" data-booking-index="'+i+'">'+(g.icon?'<img src="'+url(g.icon)+'" alt="">':'')+escapeHtml(g.game)+'</button>').join('')+'</div></div>':'');
}
