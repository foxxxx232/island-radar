name: Sync App Store TW HK MO
on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 google-play-scraper
      - run: python scripts/sync_appstore.py
      - run: python scripts/sync_googleplay.py
      - name: Commit verified source records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/appstore.json data/googleplay.json
          git diff --cached --quiet || (git commit -m "Refresh iOS and Google Play public chart data" && git push)
